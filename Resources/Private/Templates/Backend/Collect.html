<f:layout name="Module" />

<f:section name="Content">
    <h1>{f:translate(key: 'collect.headline', extensionName: 't3locallang')}</h1>

    <div class="panel panel-default">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>{translations -> f:count()} {f:translate(key: 'collect.table.entries', extensionName: 't3locallang')}</th>
                    <f:for each="{locales}" as="locale">
                        <f:if condition="{locale} === 'default'">
                            <f:then>
                                <th>en ({locale})</th>
                            </f:then>
                            <f:else>
                                <th>{locale}</th>
                            </f:else>
                        </f:if>
                    </f:for>
                </tr>
            </thead>
            <tbody>
                <f:for each="{translations}" as="entry" key="key">
                    <tr class="{f:if(condition: '{entry.used}', else: 'table-warning')}">
                        <th>{key}</th>
                        <f:for each="{locales}" as="locale">
                            <td class="{f:if(condition: '{entry.translations.{locale}}', else: 'table-danger bg-danger')}">{entry.translations.{locale}}</td>
                        </f:for>
                    </tr>
                </f:for>
            </tbody>
        </table>
    </div>
</f:section>
